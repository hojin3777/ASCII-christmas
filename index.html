<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#03050a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Merry Christmas · ASCII</title>

  <!-- D2Coding, Cascadia Code & Lobster (thick brush cursive for ASCII rasterization) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cascadia+Code:wght@400;600;700&family=Lobster&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wan2land/d2coding/d2coding-full.css" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="viewport">
    <div class="stage-frame" id="stageFrame">
      <canvas id="stage" aria-label="ASCII Christmas Tree Animation"></canvas>
      <button id="replayBtn" class="replay-btn" type="button" aria-label="처음부터 다시 재생" title="다시 재생">
        <svg class="replay-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12a9 9 0 1 1-2.64-6.36" />
          <polyline points="21 3 21 9 15 9" />
        </svg>
      </button>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
