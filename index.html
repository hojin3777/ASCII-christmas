<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#03050a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Merry Christmas · ASCII</title>

  <!-- D2Coding, Cascadia Code & Lobster (thick brush cursive for ASCII rasterization) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cascadia+Code:wght@400;600;700&family=Lobster&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wan2land/d2coding/d2coding-full.css" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="viewport">
    <div class="stage-frame" id="stageFrame">
      <canvas id="stage" aria-label="ASCII Christmas Tree Animation"></canvas>
      <div class="top-controls">
        <button id="soundBtn" class="circle-btn sound-btn muted" type="button" aria-label="소리 켜기" title="소리 켜기/끄기">
          <!-- Sound ON icon -->
          <svg class="btn-icon icon-sound-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14" />
          </svg>
          <!-- Sound OFF icon -->
          <svg class="btn-icon icon-sound-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
            <line x1="22" y1="9" x2="16" y2="15" />
            <line x1="16" y1="9" x2="22" y2="15" />
          </svg>
        </button>
        <button id="replayBtn" class="circle-btn replay-btn" type="button" aria-label="처음부터 다시 재생" title="다시 재생">
          <svg class="btn-icon replay-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-2.64-6.36" />
            <polyline points="21 3 21 9 15 9" />
          </svg>
        </button>
      </div>

      <!-- Secret Code Modal Overlay -->
      <div id="codeOverlay" class="code-overlay" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="codeTitle">
        <div id="codeModal" class="code-modal">
          <div class="code-header">
            <p id="codeTitle" class="code-title">Enter code</p>
            <button id="codeCloseBtn" class="code-close-btn" type="button" aria-label="닫기" title="닫기">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="18" y1="6" x2="6" y2="18" />
                <line x1="6" y1="6" x2="18" y2="18" />
              </svg>
            </button>
          </div>
          <div id="codeSlotsWrap" class="code-slots-wrap">
            <div class="code-slots" id="codeSlots" aria-hidden="true">
              <span class="code-slot" data-index="0">_</span>
              <span class="code-slot" data-index="1">_</span>
              <span class="code-slot" data-index="2">_</span>
              <span class="code-slot" data-index="3">_</span>
            </div>
            <input
              id="codeInput"
              class="code-hidden-input"
              type="tel"
              inputmode="numeric"
              pattern="[0-9]*"
              maxlength="4"
              autocomplete="one-time-code"
              aria-label="4자리 숫자 코드 입력"
            />
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
